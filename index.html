<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constructora SV · Calculadora de Presupuestos Inteligente</title>
<style>
:root{--ink:#121212;--muted:#888;--line:#333;--bg:#141414;--paper:#1e1e1e;--yellow:#ffcc00;--yellow-dark:#d9ab00;--radius:12px;--shadow:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#f1f1f1;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--yellow)}
.app{max-width:1520px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:#0d0d0d;color:#f1f1f1;padding:25px 14px;position:sticky;top:0;height:100vh;overflow:auto;border-right:2px solid var(--yellow)}
.brand{display:flex;gap:12px;align-items:center;padding:6px 12px 26px}
.brand-icon{width:45px;height:45px;border-radius:10px;background:var(--yellow);color:#111;display:grid;place-items:center;font-weight:900;font-size:24px}
.brand strong{font-size:19px;letter-spacing:-.5px;color:var(--yellow)}
.brand small{display:block;color:#888;font-size:11px}
.nav-label{padding:14px 12px 7px;color:var(--yellow);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.nav{border:0;background:transparent;color:#ccc;display:flex;text-align:left;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:8px;font-weight:600;font-size:13px}
.nav span:first-child{font-size:18px;width:24px}
.nav:hover{background:#222;color:var(--yellow)}
.nav.active{background:var(--yellow);color:#111;font-weight:700}
.side-bottom{padding:20px 12px;font-size:12px;color:#777;border-top:1px solid #222;margin-top:22px}
.content{padding:28px clamp(14px,3vw,44px) 50px;min-width:0;background:var(--bg)}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
.eyebrow{font-size:12px;letter-spacing:1.3px;color:var(--yellow);font-weight:900;text-transform:uppercase}
.header h1{font-size:clamp(24px,3vw,35px);margin:4px 0 6px;color:#fff}
.sub{color:var(--muted);margin:0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #444;background:#262626;color:#fff;border-radius:8px;padding:10px 14px;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--yellow);background:#333}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#111}
.btn.primary:hover{background:var(--yellow-dark)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.metric,.panel{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow)}
.metric{padding:18px}.metric .cap{font-size:12px;color:var(--muted);font-weight:700}.metric .num{font-weight:850;font-size:25px;margin:5px 0;color:var(--yellow)}.metric .foot{font-size:11px;color:#777}
.panel{padding:23px;margin-bottom:18px}.panel h2{margin:0 0 5px;font-size:20px;color:var(--yellow)}.panel h3{font-size:16px;margin:0 0 7px;color:#fff}.panel p{margin:5px 0 16px;color:var(--muted)}
.intro{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin-top:18px}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field{min-width:0}.field label{display:block;font-size:12px;color:#ccc;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #444;border-radius:8px;background:#2a2a2a;color:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--yellow);border-color:var(--yellow)}
.field input[readonly], .field select[readonly]{background:#1d1d1d;color:#999;cursor:not-allowed}
.field textarea{min-height:80px;resize:vertical}
.formgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.results{margin:17px 0;background:#222;border:1px solid #444;border-radius:10px;padding:15px;display:flex;gap:30px;flex-wrap:wrap}
.results b{display:block;font-size:22px;color:var(--yellow)}.results small{color:var(--muted)}
.section{display:none}.section.active{display:block}
.tablewrap{width:100%;overflow:auto}
